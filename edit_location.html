<div class="home-bgr">
    <div>.</div>

            <path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
            </svg>
        </div>
        <div class="p-5">
            <input type="submit" value="edit" class="btn btn-primary">
        </div>
    </form>
</div>
</div>
